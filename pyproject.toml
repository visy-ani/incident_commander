[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-incident-commander"
version = "0.1.0"
description = "Incident Commander environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "openai>=1.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "incident_commander.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["incident_commander", "incident_commander.server"]
package-dir = { "incident_commander" = ".", "incident_commander.server" = "server" }
